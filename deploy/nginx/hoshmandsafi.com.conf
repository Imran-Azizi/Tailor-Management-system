# Hoshmand Safi — recommended VPS nginx config
# Node serves BOTH the React app and /api on port 8000.
# nginx only forwards all traffic to Node (no separate static root).
#
# Install:
#   sudo cp deploy/nginx/hoshmandsafi.com.conf /etc/nginx/sites-available/hoshmandsafi.com
#   sudo ln -sf /etc/nginx/sites-available/hoshmandsafi.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream tailor_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hoshmandsafi.com www.hoshmandsafi.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://tailor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}

