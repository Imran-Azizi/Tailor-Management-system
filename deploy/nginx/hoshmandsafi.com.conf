# Hoshmand Safi Tailor System — nginx site config
# Install: sudo cp deploy/nginx/hoshmandsafi.com.conf /etc/nginx/sites-available/hoshmandsafi.com
#          sudo ln -sf /etc/nginx/sites-available/hoshmandsafi.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream tailor_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hoshmandsafi.com www.hoshmandsafi.com;

    # After SSL is configured, redirect HTTP to HTTPS:
    # return 301 https://$host$request_uri;

    root /var/www/Tailor-Management-system/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    # ── API + uploads MUST be proxied to Node (never served as static files) ──
    location /api {
        proxy_pass http://tailor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location /uploads {
        proxy_pass http://tailor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Frontend SPA (Vite build output) ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

